name: DL_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python = 3.10
  - numpy = 2.2.6
  - pillow = 12.1.1
  - matplotlib = 3.10.9
  - contourpy = 1.3.2  
  - pandas = 2.3.3
  - pip =  26.0.1
  - pip:
    - torch = 2.11.0+cu128
    - torchvision = 0.26.0+cu128
    - torchaudio = 2.11.0+cu128
    - tqdm= 4.67.3
    
